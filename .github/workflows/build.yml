name: Build & Release

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  # Forge 7.8.1 currently exits early during packaging on Node 26.
                  # Keep CI on the version used by the verified local build.
                  node-version: '24.10.0'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Build Electron app
              run: npm run make:ci

            - name: Upload Windows artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hd-audio-process-windows
                  path: out/make/
                  if-no-files-found: error

    build-macos:
        runs-on: macos-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  # Forge 7.8.1 currently exits early during packaging on Node 26.
                  # Keep CI on the version used by the verified local build.
                  node-version: '24.10.0'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Set executable permissions for audio helper binaries
              run: |
                  chmod +x src/assets/SystemAudioDump
                  chmod +x src/assets/AudioHelper.app/Contents/MacOS/SystemAudioDump

            - name: Build Electron app
              run: npm run make:ci

            - name: Upload macOS artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hd-audio-process-macos
                  path: out/make/
                  if-no-files-found: error

    build-linux:
        runs-on: ubuntu-latest
        env:
            # Workaround for onnxruntime-node GPU NuGet bug on Linux:
            # skip optional GPU provider download during install
            ONNXRUNTIME_NODE_INSTALL: skip
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                  # Forge 7.8.1 currently exits early during packaging on Node 26.
                  # Keep CI on the version used by the verified local build.
                  node-version: '24.10.0'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

            - name: Build Electron app
              run: npm run make:ci

            - name: Upload Linux artifact
              uses: actions/upload-artifact@v4
              with:
                  name: hd-audio-process-linux
                  path: out/make/
                  if-no-files-found: error
