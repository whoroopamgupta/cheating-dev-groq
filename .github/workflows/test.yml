name: Node.js CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24.10.0'
                  cache: 'npm'
            - run: npm ci
            - run: npm test
